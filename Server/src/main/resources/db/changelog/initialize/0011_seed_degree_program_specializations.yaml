  # Assign all 13 specializations to all 11 degree programs (from 0010)
  - changeSet:
      id: 0011-assign-specializations-to-programs
      author: system
      changes:
        - sql:
            - INSERT INTO degree_program_specialization_assignment (degree_program_id, degree_program_specialization_id)
              SELECT dp.degree_program_id, ds.degree_program_specialization_id
              FROM degree_program dp
              CROSS JOIN degree_program_specialization ds
              WHERE dp.degree_program_id BETWEEN 1 AND 11
                AND ds.degree_program_specialization_id BETWEEN 1 AND 13
