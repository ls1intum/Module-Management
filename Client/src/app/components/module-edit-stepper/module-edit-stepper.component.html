<nav class="stepper-nav">
  @for (step of steps(); track step.id; let i = $index) {
    <button type="button" class="step-item" [class.step-item--active]="i === currentIndex()" [class.step-item--completed]="stepCompleted()[i]" (click)="goToStep(i)">
      <span class="step-number">
        @if (stepCompleted()[i]) {
          <i class="pi pi-check"></i>
        } @else {
          {{ i + 1 }}
        }
      </span>
      <span class="step-title">{{ step.title }}</span>
    </button>
  }
</nav>
