<nav class="stepper-nav">
  @for (step of steps(); track step.id; let i = $index) {
    <button
      type="button"
      class="step-item"
      [class.step-item--active]="i === currentIndex()"
      [class.step-item--completed]="stepStatuses()[i] === StepperStatus.Completed"
      [class.step-item--pending]="stepStatuses()[i] === StepperStatus.Pending"
      [class.step-item--action-required]="stepStatuses()[i] === StepperStatus.ActionRequired"
      (click)="goToStep(i)"
    >
      <span class="step-number">
        @if (stepStatuses()[i] === StepperStatus.Completed) {
          <i class="pi pi-check"></i>
        } @else {
          {{ i + 1 }}
        }
      </span>
      <span class="step-title">{{ step.title }}</span>
    </button>
  }
</nav>
