<nav class="stepper-nav">
  @for (step of steps(); track step.id; let i = $index) {
    <button type="button" class="step-item" [class.step-item--active]="i === currentIndex()" (click)="goToStep(i)">
      <p-avatar
        [label]="stepStatuses()[i] === StepperStatus.Completed ? undefined : (i + 1).toString()"
        [icon]="stepStatuses()[i] === StepperStatus.Completed ? 'pi pi-check' : undefined"
        shape="circle"
        size="normal"
        [style]="getStepAvatarStyle(i)"
      />
      <span class="step-title">{{ step.title }}</span>
    </button>
  }
</nav>
